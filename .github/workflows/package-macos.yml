name: Package macOS

on:
  workflow_dispatch:
    inputs:
      sign:
        description: Require Developer ID signing and notarization
        type: boolean
        default: true
      release_tag:
        description: Optional new preview tag to publish after verification (e.g. v0.2.0-rc.4)
        type: string
        default: ''
  workflow_call:
    inputs:
      sign:
        description: Require Developer ID signing and notarization
        type: boolean
        default: false
    secrets:
      MACOS_CERTIFICATE:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_CODESIGN_IDENTITY:
        required: false
      MACOS_NOTARY_APPLE_ID:
        required: false
      MACOS_NOTARY_TEAM_ID:
        required: false
      MACOS_NOTARY_PASSWORD:
        required: false
    outputs:
      version:
        description: Application version read from the built bundle
        value: ${{ jobs.macos-arm64.outputs.version }}
      dmg_name:
        description: Disk image filename
        value: ${{ jobs.macos-arm64.outputs.dmg_name }}
      artifact_name:
        description: Uploaded workflow artifact name
        value: ${{ jobs.macos-arm64.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      version: ${{ steps.package.outputs.version }}
      dmg_name: ${{ steps.package.outputs.dmg_name }}
      artifact_name: frame-extractor-macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate preview publication request
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SIGN: ${{ inputs.sign }}
        run: |
          test "$SIGN" = true
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]

      - name: Prepare vcpkg binary cache
        id: vcpkg-cache
        run: |
          mkdir -p "${{ runner.temp }}/vcpkg-archives"
          vcpkg_commit=$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse HEAD)
          echo "toolchain_key=$vcpkg_commit-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg binary cache
        id: vcpkg-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: >-
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-cache.outputs.toolchain_key }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-cache.outputs.toolchain_key }}-

      - name: Prepare Apple signing certificate
        id: signing
        env:
          ENABLE_APPLE_SIGNING: ${{ inputs.sign }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          if [ "$ENABLE_APPLE_SIGNING" != true ]; then
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "Using an ad-hoc signature for this package."
            exit 0
          fi
          for variable in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD MACOS_CODESIGN_IDENTITY \
            MACOS_NOTARY_APPLE_ID MACOS_NOTARY_TEAM_ID MACOS_NOTARY_PASSWORD; do
            if [ -z "${!variable}" ]; then
              echo "Required signing secret is missing: $variable" >&2
              exit 1
            fi
          done
          case "$MACOS_CODESIGN_IDENTITY" in
            "Developer ID Application:"*) ;;
            *) echo "A Developer ID Application identity is required." >&2; exit 1 ;;
          esac
          umask 077
          certificate_path="$RUNNER_TEMP/frame-extractor-certificate.p12"
          keychain_path="$RUNNER_TEMP/frame-extractor-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          echo "identity=$MACOS_CODESIGN_IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Install vcpkg dependencies
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/vcpkg-archives,readwrite"
        run: >-
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install
          --triplet arm64-osx-release
          --overlay-triplets=cmake/triplets

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/vcpkg-archives
          key: >-
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ steps.vcpkg-cache.outputs.toolchain_key }}-${{ hashFiles('vcpkg.json', 'cmake/triplets/*.cmake') }}

      - name: Configure
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}/vcpkg-archives,readwrite"
        run: >-
          cmake -S . -B build/package
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=arm64-osx-release
          -DVCPKG_OVERLAY_TRIPLETS="${{ github.workspace }}/cmake/triplets"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0
          -DFRAME_EXTRACTOR_BUILD_TESTS=ON
          -DFRAME_EXTRACTOR_GUI_SMOKE_TEST=ON
          -DFRAME_EXTRACTOR_PACKAGE_STANDALONE=ON
          -DFRAME_EXTRACTOR_MACOS_CODESIGN_IDENTITY="${{ steps.signing.outputs.identity }}"

      - name: Build and test
        run: |
          cmake --build build/package --parallel
          ctest --test-dir build/package --output-on-failure

      - name: Resolve package metadata
        id: package
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw \
            "build/package/Frame Extractor.app/Contents/Info.plist")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            expected_tag="v$version"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" \
              && "$GITHUB_REF_NAME" != "$expected_tag"-rc.* ]]; then
              echo "Tag $GITHUB_REF_NAME does not match application version $version." >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dmg_name=Frame-Extractor-$version-macOS-arm64.dmg" >> "$GITHUB_OUTPUT"

      - name: Build disk image
        run: cmake --build build/package --target package

      - name: Verify packaged application
        run: |
          dmg="build/package/${{ steps.package.outputs.dmg_name }}"
          mount_point=$(mktemp -d "$RUNNER_TEMP/frame-extractor-dmg.XXXXXX")
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            rmdir "$mount_point" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          scripts/verify_macos_bundle.sh "$mount_point/Frame Extractor.app"
          cmake "-DGUI=$mount_point/Frame Extractor.app/Contents/MacOS/Frame Extractor" \
            "-DFIXTURE_TOOL=$PWD/build/package/frame_extractor_fixture_tool" \
            "-DSOURCE_DIR=$PWD" "-DTEST_ROOT=$RUNNER_TEMP/frame-extractor-gui-smoke" \
            -P tests/gui_smoke.cmake

      - name: Sign and notarize disk image
        if: inputs.sign
        env:
          MACOS_CODESIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          dmg="build/package/${{ steps.package.outputs.dmg_name }}"
          codesign --force --sign "$MACOS_CODESIGN_IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" --wait \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mount_point=$(mktemp -d "$RUNNER_TEMP/frame-extractor-signed.XXXXXX")
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true; rmdir "$mount_point"' EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          app="$mount_point/Frame Extractor.app"
          codesign --verify --deep --strict "$app"
          actual_team=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          test "$actual_team" = "$MACOS_NOTARY_TEAM_ID"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Create checksum
        working-directory: build/package
        run: >-
          shasum -a 256 "${{ steps.package.outputs.dmg_name }}"
          > "${{ steps.package.outputs.dmg_name }}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frame-extractor-macos-arm64
          path: |
            build/package/${{ steps.package.outputs.dmg_name }}
            build/package/${{ steps.package.outputs.dmg_name }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing keychain
        if: always() && inputs.sign
        run: |
          keychain_path="$RUNNER_TEMP/frame-extractor-signing.keychain-db"
          if [ -e "$keychain_path" ]; then
            security delete-keychain "$keychain_path"
          fi
          rm -f "$RUNNER_TEMP/frame-extractor-certificate.p12"

  publish-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.sign && inputs.release_tag != ''
    needs: macos-arm64
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      VERSION: ${{ needs.macos-arm64.outputs.version }}
      DMG: ${{ needs.macos-arm64.outputs.dmg_name }}
      ARTIFACT: ${{ needs.macos-arm64.outputs.artifact_name }}
    steps:
      - name: Publish verified macOS preview
        run: |
          [[ "$RELEASE_TAG" == "v$VERSION-rc."* ]]
          gh run download "$GITHUB_RUN_ID" --name "$ARTIFACT" --dir release
          cd release
          sha256sum --check "$DMG.sha256"
          gh release create "$RELEASE_TAG" "$DMG" "$DMG.sha256" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Frame Extractor $RELEASE_TAG — signed macOS preview" \
            --notes "Apple Silicon, macOS 14 or newer. Developer ID signed and notarized by Apple, with a stapled notarization ticket. This preview contains only the macOS package; Windows and Linux downloads remain available in v0.2.0-rc.3."
