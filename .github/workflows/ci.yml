name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  macos:
    # package-macos.yml contains a publish-preview job that requests these
    # permissions. It only runs on a manual dispatch of that workflow, but a
    # caller must still grant them or this workflow fails at startup.
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/package-macos.yml

  windows:
    uses: ./.github/workflows/package-windows.yml

  linux:
    uses: ./.github/workflows/package-linux.yml
